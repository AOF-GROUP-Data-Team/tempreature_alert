name: Temperature Check Report

on:
  workflow_dispatch:
    inputs:
      window_start:
        description: 'Window start (YYYY-MM-DD HH:MM) KSA. Leave empty for auto.'
        required: false
        default: ''
      window_end:
        description: 'Window end (YYYY-MM-DD HH:MM) KSA. Leave empty for auto.'
        required: false
        default: ''

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Temperature Report
        env:
          ZENPUT_API_KEY: ${{ secrets.ZENPUT_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          INPUT_START: ${{ github.event.inputs.window_start }}
          INPUT_END: ${{ github.event.inputs.window_end }}
        run: python temperature_report.py
